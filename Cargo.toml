[workspace]
members = ["crates/rypsok-core", "crates/rypsok"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nabbisen/rypsok"
authors = ["nabbisen"]

[workspace.dependencies]
rypsok-core = { path = "crates/rypsok-core", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", default-features = false, features = ["derive", "std"] }
toml = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "sync", "time", "macros", "io-std", "io-util", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["json", "fmt", "std", "time"] }
governor = { version = "0.10", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
