[package]
name = "rypsok-core"
description = "Core library of rypsok, a headless meta-search service for AI agents: models, pipelines, drivers and policies, free of any protocol dependency"
readme = "README.md"
keywords = ["search", "meta-search", "mcp", "agents"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["engine-wikipedia", "engine-brave", "engine-duckduckgo"]
## The Wikipedia driver (keyless).
engine-wikipedia = []
## The Brave Search driver (keyed).
engine-brave = []
## The DuckDuckGo HTML driver: a scraping driver, off unless
## `[scraping] enabled = true` (RFC 015).
engine-duckduckgo = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
governor.workspace = true
unicode-normalization.workspace = true
unicode-general-category.workspace = true
html-escape.workspace = true
reqwest.workspace = true
rustls.workspace = true
async-trait.workspace = true
url.workspace = true
ipnet.workspace = true
html5ever.workspace = true
markup5ever.workspace = true
encoding_rs.workspace = true
chardetng.workspace = true
robotstxt.workspace = true
regex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
wiremock.workspace = true
flate2.workspace = true

[lints]
workspace = true
