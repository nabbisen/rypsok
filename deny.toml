# cargo-deny policy (REQ-SEC-020, RFC 001). Run: cargo deny check advisories bans licenses sources

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  # Root certificate data of the TLS stack (webpki-roots); data, not code.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# RFC 001 documents the allowed set as policy, including licenses no
# dependency uses today (BSD-2-Clause, MPL-2.0): a dependency that brings one
# of them must not fail the build. An allowance nothing uses is therefore not
# a warning.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
