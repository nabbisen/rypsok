name: Scheduled checks

# Reports only; never a gate (RFC 002): the fuzz targets of RFC 018 and the
# live driver checks of REQ-TEST-003.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    # REQ-SEC-023 (RFC 018): every parser that reads external bytes has a
    # fuzz target under fuzz/; each runs for a fixed time, report only.
    name: Fuzz targets (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-27
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz
      - name: Build the targets
        working-directory: fuzz
        run: cargo +nightly fuzz build
      - name: Run each target for 120 s
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -rss_limit_mb=2048 -timeout=30
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  live-checks:
    name: Live driver checks (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-27
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Live checks (REQ-TEST-003)
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          RYPSOK_LIVE_CONTACT: ${{ vars.RYPSOK_LIVE_CONTACT }}
        run: cargo test -p rypsok --test live -- --ignored --nocapture
