name: Scheduled checks

# Reports only; never a gate (RFC 002). Fuzz targets and live driver checks
# arrive with milestone M1; the placeholders keep the job visible.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz targets
        run: |
          if [ -d fuzz ]; then
            echo "fuzz targets present; running is wired in milestone M1"
          else
            echo "no fuzz targets yet"
          fi

  live-checks:
    name: Live driver checks (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live checks (REQ-TEST-003)
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          RYPSOK_LIVE_CONTACT: ${{ vars.RYPSOK_LIVE_CONTACT }}
        run: cargo test -p rypsok --test live -- --ignored --nocapture
