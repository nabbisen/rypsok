# Builds the container image on a release tag and keeps it as a workflow
# artifact (RFC 013). Publication to a registry is a separate decision.
name: release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t rypsok:${GITHUB_REF_NAME} .
      - name: Save the image
        run: docker save rypsok:${GITHUB_REF_NAME} | gzip > rypsok-${GITHUB_REF_NAME}-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rypsok-${{ github.ref_name }}-image
          path: rypsok-*-image.tar.gz
