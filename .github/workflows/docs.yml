name: Book

# Builds the book and publishes it to GitHub Pages from the release tag
# (RFC 020, D-17; RFC 017). The book describes the release the reader has,
# so a push to main publishes nothing: CI's `rules` job builds the book on
# every push, so a broken book is red at once. A tag X.Y.Z publishes; a manual
# run publishes the ref it was started from (a tag or main, the owner's
# choice), and the first page says which.
#
# Publishing needs Pages enabled on the repository with the source "GitHub
# Actions" and the tag rule `[0-9]*` in the `github-pages` environment
# (docs/src/maintainers/releasing.md). A failed publish is red.
on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: 0.5.4
      # The first page says which release the book describes. The text between
      # the two markers of introduction.md is replaced; a missing marker fails
      # the job, so the line cannot be dropped silently. The ref comes in as
      # environment variables, never pasted into the script.
      - name: Say which release the book describes
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          file=docs/src/introduction.md
          for marker in '<!-- release -->' '<!-- /release -->'; do
            if ! grep -qxF "$marker" "$file"; then
              echo "::error::$file lacks the line $marker"
              exit 1
            fi
          done
          if [ "$REF_TYPE" = tag ]; then
            if ! printf '%s' "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::the tag $REF_NAME is not of the form X.Y.Z"
              exit 1
            fi
            line="This book describes rypsok $REF_NAME."
          else
            line="This book describes the development version of rypsok at commit ${COMMIT:0:7}, not a release."
          fi
          awk -v line="$line" '
            $0 == "<!-- release -->" { print; print line; skip = 1; next }
            $0 == "<!-- /release -->" { skip = 0 }
            !skip { print }
          ' "$file" > "$file.new"
          mv "$file.new" "$file"
          grep -qxF "$line" "$file"
          echo "$line"
      - name: Build
        run: mdbook build docs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/book

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.repository == 'nabbisen/rypsok'
    runs-on: ubuntu-latest
    # The only job that may publish: Pages and the OIDC token are granted
    # here and not to the workflow (RFC 020, DEP-5).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
